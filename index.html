<title>Lake Michigan Frontage Watch</title>
<style>
  :root{
    --bg:#0f1220; --card:#181c30; --card2:#1f243d; --ink:#eef1ff; --mut:#9aa3c7;
    --acc:#7aa2ff; --grn:#4ade80; --amb:#fbbf24; --red:#f87171; --pur:#c084fc;
    --bd:#272d4b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:16px 16px 12px;border-bottom:1px solid var(--bd);
    background:linear-gradient(180deg,#171b30 0%,#0f1220 100%)}
  .kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
  h1{margin:2px 0 4px;font-size:20px;font-weight:800}
  .sub{color:var(--mut);font-size:12px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px}
  .stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 8px;text-align:center}
  .stat .n{font-size:18px;font-weight:800;line-height:1.1}
  .stat .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
  .stat .s{font-size:10px;color:var(--mut);margin-top:2px}
  .n.grn{color:var(--grn)} .n.amb{color:var(--amb)} .n.acc{color:var(--acc)} .n.red{color:var(--red)}
  .sec{padding:4px 16px 12px}
  .sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:12px 0 8px}
  .hl{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:13px;color:#d6dcff}
  .hl div{padding:4px 0}
  .hl div+div{border-top:1px dashed var(--bd)}
  .bar{position:sticky;top:0;z-index:5;background:rgba(15,18,32,.95);backdrop-filter:blur(8px);
    padding:8px 16px;border-bottom:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap}
  .bar input,.bar select{background:var(--card);color:var(--ink);border:1px solid var(--bd);
    border-radius:10px;padding:8px 10px;font-size:13px}
  .bar input{flex:1 1 160px;min-width:0}
  .list{padding:10px 16px 24px;display:flex;flex-direction:column;gap:8px}
  .row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
  .row:active{background:var(--card2)}
  .row.uc{opacity:.76}
  .row .a{font-weight:700;font-size:14px}
  .row .m{font-size:12px;color:var(--mut);margin-top:2px}
  .row .r{text-align:right;flex-shrink:0}
  .row .p{font-weight:800;font-size:15px}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;
    text-transform:uppercase;letter-spacing:.05em;margin-left:6px;vertical-align:middle}
  .p-new{background:rgba(74,222,128,.16);color:var(--grn)}
  .p-cut{background:rgba(251,191,36,.16);color:var(--amb)}
  .p-up{background:rgba(248,113,113,.16);color:var(--red)}
  .p-uc{background:rgba(192,132,252,.16);color:var(--pur)}
  .p-lot{background:rgba(122,162,255,.16);color:var(--acc)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:20}
  .modal-bg.open{display:flex}
  .modal{background:var(--card);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;
    width:100%;max-height:84vh;overflow:auto;padding:16px 18px 28px}
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal .pr{font-size:20px;font-weight:800;color:var(--acc);margin-bottom:10px}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;padding:10px 0;
    border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
  .kv b{color:var(--mut);font-weight:600}
  .note{font-size:13px;color:#d6dcff;margin:10px 0 14px;line-height:1.5}
  .btn{display:inline-block;background:var(--acc);color:#0b0e1a;font-weight:800;text-decoration:none;
    padding:10px 14px;border-radius:10px;font-size:13px;margin-right:8px}
  .btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--bd)}
  .hist{padding:0 16px 32px}
  .hday{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12px}
  .hday b{font-size:13px}
  .chart-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
  .chart-tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .chart-tab{background:var(--card2);color:var(--mut);border:1px solid var(--bd);border-radius:8px;
    padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .chart-tab.on{background:var(--acc);color:#0b0e1a;border-color:var(--acc)}
  .chart-leg{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
  .chart-leg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .leg-act::before{background:#7aa2ff} .leg-new::before{background:#4ade80}
  .leg-cut::before{background:#fbbf24} .leg-uc::before{background:#c084fc}
  .moi-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
  .moi-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
  .moi-big{font-size:26px;font-weight:800;line-height:1}
  .moi-badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.06em}
  .b-sellers{background:rgba(74,222,128,.16);color:var(--grn)}
  .b-neutral{background:rgba(251,191,36,.16);color:var(--amb)}
  .b-buyers{background:rgba(248,113,113,.16);color:var(--red)}
  .moi-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px;font-size:12px}
  .moi-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--card2);border-radius:8px}
  .moi-row .k{font-weight:600}
  .moi-row .v{color:var(--mut);text-align:right}
  .moi-row .v b{color:var(--ink);margin-right:6px}
  .moi-sub{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:10px 0 4px;font-weight:700}
  .moi-foot{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.45;border-top:1px dashed var(--bd);padding-top:8px}
  .moi-foot a{color:var(--acc);text-decoration:none}
  .jump{display:flex;gap:6px;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .jump a{flex-shrink:0;background:var(--card2);color:var(--ink);border:1px solid var(--bd);border-radius:999px;
    padding:5px 11px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
  .jump a.on{background:var(--acc);color:#0b0e1a;border-color:var(--acc)}
  .region{border-top:3px solid var(--acc);margin-top:18px;scroll-margin-top:96px}
  .rhead{padding:14px 16px 4px}
  .rhead .kicker{color:var(--mut)}
  .rhead h2{margin:2px 0 4px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 16px}
  .rstats .stat{padding:8px 4px}
  .rstats .stat .n{font-size:16px}
  .subh{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:12px 16px 0;font-weight:700}
  .region .list{padding:8px 16px 8px}
  .empty{font-size:12px;color:var(--mut);padding:4px 2px}
</style>
</head>

<header>

<div id="regions"></div>

  <div id="hist"></div>

</div>

      <div class="stat"><div class="n">${r.active}</div><div class="l">Active</div><div class="s">${r.houses} homes · ${r.lots} lots</div></div>
      <div class="stat"><div class="n" style="color:var(--pur)">${r.under_contract}</div><div class="l">Under contract</div></div>
      <div class="stat"><div class="n acc">${r.closed_12m}</div><div class="l">Closed 12m</div><div class="s">${r.monthly_pace!=null?r.monthly_pace+"/mo":""}</div></div>
      <div class="stat"><div class="n ${mcCls(r.market_code)}">${r.moi!=null?r.moi.toFixed(1)+"m":"—"}</div><div class="l">Months inv.</div></div>
    </div>
    <div class="sec"><div class="chart-card">
      <div class="chart-tabs">
        <button class="chart-tab on" id="tab-h-${r.id}" onclick="setChart('${r.id}','House')">Homes · $ vs sq ft</button>
        <button class="chart-tab" id="tab-l-${r.id}" onclick="setChart('${r.id}','Lot')">Lots · $ vs acres</button>
      </div>
      <div id="chart-${r.id}"></div>
      <div class="chart-leg"><span class="leg-act">Active</span><span class="leg-new">New</span><span class="leg-cut">Price cut</span><span class="leg-uc">Under contract</span></div>
    </div></div>
    <div class="subh" id="hh-${r.id}">Homes</div><div class="list" id="lh-${r.id}"></div>
    <div class="subh" id="lh2-${r.id}">Vacant lots</div><div class="list" id="ll-${r.id}"></div>
  </section>`).join("");

function setChart(rid,t){
  CHART_T[rid] = t;
  document.getElementById("tab-h-"+rid).classList.toggle("on", t==="House");
  document.getElementById("tab-l-"+rid).classList.toggle("on", t==="Lot");
  renderChart(rid);
}
function renderChart(rid){
  const r = REGS.find(z=>z.id===rid); const T = CHART_T[rid] || "House";
  const el = document.getElementById("chart-"+rid);
  const xKey = T === "House" ? "sqft" : "lot_ac";
  const xLbl = T === "House" ? "sq ft" : "acres";
  const pts = DATA.board.map((x,i)=>({...x,_i:i})).filter(x => x.region===r.key && x.type === T && x[xKey] && x.price);
  if (!pts.length){ el.innerHTML = "<div class='sub'>No data</div>"; return; }
  const W = 340, H = 190, P = {l:44,r:12,t:12,b:26};
  const xMax = Math.max(...pts.map(p=>p[xKey]))*1.08, yMax = Math.max(...pts.map(p=>p.price))*1.08;
  const sx = v => P.l + v/xMax*(W-P.l-P.r);
  const sy = v => H-P.b - v/yMax*(H-P.t-P.b);
  const col = p => p.status!=="Active" ? "#c084fc" : p.change==="NEW" ? "#4ade80" : p.change==="PRICE_DOWN" ? "#fbbf24" : "#7aa2ff";
  const ticks = [0.25,0.5,0.75,1];
  const fmtX = v => T==="House" ? Math.round(v/100)*100 : (v>=10?Math.round(v):v.toFixed(1));
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${ticks.map(f=>{const v=yMax*f;return `<line x1="${P.l}" x2="${W-P.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="#272d4b" stroke-dasharray="2,3"/>
        <text x="${P.l-5}" y="${sy(v)+3}" fill="#9aa3c7" font-size="9" text-anchor="end">${fmt(v)}</text>`}).join("")}
      ${ticks.map(f=>`<text x="${sx(xMax*f)}" y="${H-8}" fill="#9aa3c7" font-size="9" text-anchor="middle">${fmtX(xMax*f)} ${xLbl}</text>`).join("")}
      <line x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}" stroke="#272d4b"/>
      ${pts.map(p=>`<circle cx="${sx(p[xKey]).toFixed(1)}" cy="${sy(p.price).toFixed(1)}" r="5" fill="${col(p)}" fill-opacity=".88" stroke="#0f1220" stroke-width="1.2" style="cursor:pointer" onclick="openD(${p._i})"><title>${p.addr} — ${fmt(p.price)}</title></circle>`).join("")}
    </svg>`;
}
REGS.forEach(r=>renderChart(r.id));

function rowHtmlL(x){
  const pills = [];
  if (x.type==="Lot") pills.push('<span class="pill p-lot">Lot</span>');
  if (x.status!=="Active") pills.push('<span class="pill p-uc">Under Contract</span>');
  else if (x.change==="NEW") pills.push('<span class="pill p-new">New</span>');
  else if (x.change==="PRICE_DOWN") pills.push('<span class="pill p-cut">Price Cut</span>');
  else if (x.change==="PRICE_UP") pills.push('<span class="pill p-up">Price ↑</span>');
  const specs = x.type==="Lot"
    ? [x.frontage_ft ? x.frontage_ft+" ft frontage" : null, x.lot_ac ? x.lot_ac+" ac" : "Vacant land"].filter(Boolean).join(" · ")
    : [x.beds?x.beds+"bd":null, x.baths?x.baths+"ba":null, x.sqft?x.sqft.toLocaleString()+"sf":null, x.frontage_ft?x.frontage_ft+"ft":null, x.ppsf?"$"+x.ppsf+"/sf":null].filter(Boolean).join(" · ");
  const since = x.on_site_since || x.listed_date || x.first_seen;
  return `<div class="row ${x.status!=='Active'?'uc':''}" onclick="openD(${x._i})">
    <div><div class="a">${x.addr}${pills.join("")}</div>
      <div class="m">${x.area || ""}${specs?" · "+specs:""}${since?" · Listed "+since:""}</div></div>
    <div class="r"><div class="p">${fmt(x.price)}</div>
      <div class="m">${x.prev_price ? "was "+fmt(x.prev_price) : (x.price_change||"")}</div></div>
  </div>`;
}
function render(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const ft = document.getElementById("ft").value;
  const so = document.getElementById("so").value;
  const listedKey = x => x.on_site_since || x.listed_date || x.first_seen || "";
  const cmp = (a,b)=>{
    if (so==="new") return listedKey(b).localeCompare(listedKey(a)) || (b.price||0)-(a.price||0);
    if (so==="pasc") return (a.price||0)-(b.price||0);
    if (so==="ffdesc") return (b.frontage_ft||0)-(a.frontage_ft||0) || (b.price||0)-(a.price||0);
    if (so==="ppsf") return (a.ppsf||9e9)-(b.ppsf||9e9);
    return (b.price||0)-(a.price||0);
  };
  const all = DATA.board.map((x,i)=>({...x,_i:i})).filter(x=>
    !q || (x.addr+" "+(x.area||"")+" "+(x.county||"")+" "+(x.note||"")+" "+(x.mls||"")).toLowerCase().includes(q));
  REGS.forEach(r=>{
    const its = all.filter(x=>x.region===r.key).sort(cmp);
    const h = its.filter(x=>x.type==="House"), l = its.filter(x=>x.type==="Lot");
    const showH = ft!=="Lot", showL = ft!=="House";
    document.getElementById("hh-"+r.id).style.display = showH?"":"none";
    document.getElementById("lh-"+r.id).style.display = showH?"":"none";
    document.getElementById("lh2-"+r.id).style.display = showL?"":"none";
    document.getElementById("ll-"+r.id).style.display = showL?"":"none";
    document.getElementById("hh-"+r.id).textContent = `Homes (${h.length})`;
    document.getElementById("lh2-"+r.id).textContent = `Vacant lots (${l.length})`;
    document.getElementById("lh-"+r.id).innerHTML = h.map(rowHtmlL).join("") || '<div class="empty">No matching homes</div>';
    document.getElementById("ll-"+r.id).innerHTML = l.map(rowHtmlL).join("") || '<div class="empty">No matching lots</div>';
  });
}
["q","ft","so"].forEach(id=>document.getElementById(id).addEventListener("input",render));
render();
const jl = [...document.querySelectorAll("#jump a")];
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ const id=e.target.id.slice(4); jl.forEach(a=>a.classList.toggle("on",a.dataset.r===id)); }}),{rootMargin:"-40% 0px -55% 0px"});
REGS.forEach(r=>io.observe(document.getElementById("reg-"+r.id)));

function openD(i){
  const x = DATA.board[i];
  const rows = [
    ["Status", x.status],
    ["Type", x.type],
    ["Region / Area", x.area || "—"],
    ["Frontage", x.frontage_ft ? `${x.frontage_ft.toLocaleString()} ft Lake Michigan frontage` : "Direct Lake Michigan shoreline (ft unstated in MLS)"],
    ["Beds / Baths", x.type==="Lot" ? "Vacant land" : `${x.beds||"—"} bd / ${x.baths||"—"} ba`],
    ["Sq Ft", x.sqft ? `${x.sqft.toLocaleString()} sf ($${x.ppsf}/sf)` : "—"],
    ["Lot Size", x.lot_ac ? `${x.lot_ac} acres` : "—"],
    ["Listed", (x.on_site_since || x.listed_date) ? `${x.on_site_since || x.listed_date}${x.dom != null ? " ("+x.dom+" DOM)" : ""}` : "—"],
    ["MLS", x.mls || "—"],
    ["Source", x.broker || "—"],
    ["First tracked", x.first_seen || DATA.date],
  ];
  document.getElementById("m").innerHTML = `
    <h3>${x.addr}</h3>
    <div class="pr">${fmtFull(x.price)} ${x.prev_price?`<span style="font-size:13px;color:var(--mut);font-weight:500">(was ${fmtFull(x.prev_price)})</span>`:""}</div>
    <div class="kv">${rows.map(([k,v])=>`<b>${k}</b><span>${v}</span>`).join("")}</div>
    <div class="note">${x.note || ""}</div>
    ${x.url?`<a class="btn" href="${x.url}" target="_blank" rel="noopener">Open listing ↗</a>`:""}
    <button class="btn sec" onclick="closeM()">Close</button>`;
  document.getElementById("mb").classList.add("open");
}
function closeM(){ document.getElementById("mb").classList.remove("open"); }

const hEntries = Object.entries(DATA.history||{}).sort((a,b)=>b[0].localeCompare(a[0]));
document.getElementById("hist").innerHTML = hEntries.map(([d,h])=>{
  const lines = [];
  if (h.baseline) lines.push(`Baseline established (${h.total_active} active across 18 counties)`);
  (h.new||[]).forEach(x=>lines.push(`+ NEW: ${x.addr} (${fmt(x.price)})`));
  (h.price_changes||[]).forEach(x=>lines.push(`Δ ${x.addr}: ${fmt(x.from)} → ${fmt(x.to)}`));
  (h.status_changes||[]).forEach(x=>lines.push(`• ${x.addr}: ${x.from} → ${x.to}`));
  (h.removed||[]).forEach(x=>lines.push(`− Off board: ${x.addr} (was ${fmt(x.last_price)})`));
  if (!lines.length) lines.push("No changes vs prior run");
  return `<div class="hday"><b>${d}</b> · ${h.total_active} active<div style="color:var(--mut);margin-top:4px">${lines.slice(0,25).join("<br>")}</div></div>`;
}).join("");
</script>
</body>
</html>
